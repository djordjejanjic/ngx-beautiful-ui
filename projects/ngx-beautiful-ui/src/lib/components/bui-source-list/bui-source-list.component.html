<div class="bui-source-list">
  <button type="button" class="bui-source-list__toggle" [attr.aria-expanded]="expanded()" (click)="toggle()">
    <span class="bui-source-list__stack" aria-hidden="true">
      @for (source of sources(); track source.href) {
        @if (source.image) {
          <img class="bui-source-list__stack-avatar" alt="" [src]="source.image" />
        }
      }
    </span>
    <span class="bui-source-list__label">{{ toggleLabel() }}</span>
  </button>

  <div class="bui-collapse" [class.bui-collapse--open]="expanded()" [attr.inert]="expanded() ? null : ''">
    <div>
      <div class="bui-source-list__panel">
        @for (source of sources(); track source.href) {
          <a class="bui-source-list__item" target="_blank" rel="noopener noreferrer" [href]="source.href">
            @if (source.image) {
              <img class="bui-source-list__item-avatar" alt="" [src]="source.image" />
            }
            <span class="bui-source-list__name">{{ source.name }}</span>
            <span class="bui-source-list__domain">{{ source.domain }}</span>
          </a>
        }
      </div>
    </div>
  </div>
</div>
